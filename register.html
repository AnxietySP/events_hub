<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub – Register</title>

  <!-- 1. Bootstrap CSS (framework) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 2. Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- 3. YOUR CSS last so you can override Bootstrap -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="top">
    <h1>JNEC Events Hub</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html" title="Go to registration page">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <div class="container py-4">
      <h2 class="mb-4">Event registration</h2>

      <form action="#" method="post" enctype="multipart/form-data" id="regForm" novalidate>
        <!-- Personal Details Fieldset -->
        <fieldset class="mb-4">
          <legend>Personal Details</legend>

          <div class="mb-3">
            <label for="fullname" class="form-label">Full name</label>
            <input type="text" class="form-control" id="fullname" name="fullname">
            <span class="error text-danger small" id="fullnameError"></span>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email">
            <span class="error text-danger small" id="emailError"></span>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone">
            <span class="error text-danger small" id="phoneError"></span>
          </div>
        </fieldset>

        <!-- Event Choice Fieldset -->
        <fieldset class="mb-4">
          <legend>Event Choice</legend>

          <div class="mb-3">
            <label for="event_id" class="form-label">Event</label>
            <select class="form-select" id="event_id" name="event_id">
              <option value="">-- choose an event --</option>
              <option value="1">Tech Week Hackathon</option>
              <option value="2">Losar Festival Night</option>
              <option value="3">Inter-College Football</option>
              <option value="4">Robotics Exhibition</option>
            </select>
            <span class="error text-danger small" id="eventError"></span>
          </div>

          <div class="mb-3">
            <p class="form-label mb-1">Food preference:</p>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" id="veg" name="food" value="veg">
              <label class="form-check-label" for="veg">Vegetarian</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" id="nonveg" name="food" value="nonveg">
              <label class="form-check-label" for="nonveg">Non-vegetarian</label>
            </div>
            <div><span class="error text-danger small" id="foodError"></span></div>
          </div>

          <div class="mb-3">
            <p class="form-label mb-1">Interested in:</p>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="volunteer" name="interests" value="volunteer">
              <label class="form-check-label" for="volunteer">Volunteering</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="perform" name="interests" value="perform">
              <label class="form-check-label" for="perform">Performing</label>
            </div>
          </div>
        </fieldset>

        <!-- Other Fieldset -->
        <fieldset class="mb-4">
          <legend>Other</legend>

          <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <select class="form-select" id="department" name="department">
              <option value="it">Information Technology</option>
              <option value="civil">Civil</option>
              <option value="electrical">Electrical</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="remarks" class="form-label">Remarks</label>
            <textarea class="form-control" id="remarks" name="remarks" rows="4"></textarea>
            <span class="error text-danger small" id="remarksError"></span>
          </div>

          <div class="mb-3">
            <label for="id_card" class="form-label">Student ID card (image)</label>
            <input class="form-control" type="file" id="id_card" name="id_card" accept="image/*">
            <span class="error text-danger small" id="idCardError"></span>
          </div>
        </fieldset>

        <button type="submit" class="btn btn-primary">Register</button>
        <!-- Added id="clear-btn" to connect with validate.js popup logic -->
        <button type="reset" id="clear-btn" class="btn btn-secondary">Clear</button>
        <p class="text-success mt-3" id="form-success"></p>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 JNEC Events Hub</p>
  </footer>

  <!-- Bootstrap JS – MUST come before your own scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your scripts -->
  <script src="js/main.js"></script>
  <script src="js/validate.js"></script>
</body>
</html>
