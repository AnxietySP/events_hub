<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub – Contact</title>

  <!-- 1. Bootstrap CSS (framework) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 2. Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- 3. Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="top">
    <h1>JNEC Events Hub</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" title="Go to contact page">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Contact Us</h2>

    <p>College Address: Jigme Namgyel Engineering College, Dewathang</p>

    <p>
      Email:
      <a href="mailto:info@college.edu">info@college.edu</a>
    </p>

    <p>Phone: +975 17223344</p>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3559.363232430742!2d91.46473019999999!3d26.860198399999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x375beb9567355685%3A0x1773e4413455284a!2sJigme%20Namgyel%20Engineering%20College!5e0!3m2!1sen!2sbt!4v1787457396567!5m2!1sen!2sbt"
        width="600"
        height="450"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <h3>Enquiry Form</h3>

    <!-- Form ID added for contact.js -->
    <form id="contactForm" action="#" method="post" novalidate>
      <div>
        <label for="contact-name">Name:</label><br>
        <input type="text" id="contact-name" name="name">
        <div id="contactNameError" class="text-danger small"></div>
      </div>

      <br>

      <div>
        <label for="contact-email">Email:</label><br>
        <input type="email" id="contact-email" name="email">
        <div id="contactEmailError" class="text-danger small"></div>
      </div>

      <br>

      <div>
        <label for="contact-message">Message:</label><br>
        <textarea id="contact-message" name="message" rows="4"></textarea>
        <div id="contactMessageError" class="text-danger small"></div>
      </div>

      <br>

      <button type="submit">Submit</button>
      
      <!-- Container for success message -->
      <div id="contact-success"></div>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> JNEC Events Hub</p>
  </footer>

  <!-- Scripts loaded in correct sequence before closing </body> -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
