  <main>
    <h2>Contact Us</h2>

    <p>College Address: Jigme Namgyel Engineering College, Dewathang</p>

    <p>
      Email:
      <a href="mailto:info@college.edu">info@college.edu</a>
    </p>

    <p>Phone: +975 17223344</p>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3559.363232430742!2d91.46473019999999!3d26.860198399999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x375beb9567355685%3A0x1773e4413455284a!2sJigme%20Namgyel%20Engineering%20College!5e0!3m2!1sen!2sbt!4v1787457396567!5m2!1sen!2sbt"

    <h3>Enquiry Form</h3>

    <form action="#" method="post">
      <label for="contact-name">Name:</label>
      <input type="text" id="contact-name" name="name">

      <br><br>

      <label for="contact-email">Email:</label>
      <input type="email" id="contact-email" name="email">

      <br><br>

      <label for="contact-message">Message:</label><br>
      <textarea id="contact-message" name="message" rows="4"></textarea>

      <br><br>

      <button type="submit">Submit</button>
    </form>
  </main>
